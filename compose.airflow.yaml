
services:
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    image: pharmaflow-airflow:day2
    container_name: pharmaflow-airflow

    restart: unless-stopped

    command: standalone

    ports:
      - "127.0.0.1:8081:8080"

    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__API__BASE_URL: http://localhost:8080

      DATABASE_URL: postgresql+psycopg://pharmacy_user:pharmacy_dev_password@host.docker.internal:5433/pharmacy_db

      PYTHONPATH: /opt/project
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./:/opt/project
      - airflow_data:/opt/airflow

    working_dir: /opt/project

    mem_limit: 3g

volumes:
  airflow_data:
