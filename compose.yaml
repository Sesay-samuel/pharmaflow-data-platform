
services:
  postgres:
    image: postgres:16
    container_name: pharmaflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: pharmacy_user
      POSTGRES_PASSWORD: pharmacy_dev_password
      POSTGRES_DB: pharmacy_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pharmacy_user -d pharmacy_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
